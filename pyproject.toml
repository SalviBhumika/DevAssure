[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="devassure"
version="0.1.0"
description="Requirement traceability and controlled AI-assisted test planning"
requires-python=">=3.10"
dependencies=["fastapi>=0.110","uvicorn[standard]>=0.27","pydantic>=2.6"]
[project.optional-dependencies]
llm=["openai>=1.30"]
dev=["pytest>=8.0","httpx>=0.27","ruff>=0.4"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
[tool.ruff]
line-length=100
